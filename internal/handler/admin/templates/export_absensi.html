{{define "content"}}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-primary">
            <div class="card-header">
                <h3 class="card-title">Export Rekap Absensi</h3>
            </div>
            <div class="card-body">
                <p class="text-muted">Unduh matriks rekap absensi bulanan dalam format Excel (.xlsx)</p>
                <form method="POST">
                    <div class="form-group">
                        <label>Pilih Kelas</label>
                        <select name="kelas_id" required class="form-control">
                            {{range .Kelass}}
                            <option value="{{.ID}}">{{.Name}}</option>
                            {{end}}
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Bulan</label>
                                <select name="month" class="form-control">
                                    <option value="1">Januari</option>
                                    <option value="2">Februari</option>
                                    <option value="3">Maret</option>
                                    <option value="4">April</option>
                                    <option value="5">Mei</option>
                                    <option value="6">Juni</option>
                                    <option value="7">Juli</option>
                                    <option value="8">Agustus</option>
                                    <option value="9">September</option>
                                    <option value="10">Oktober</option>
                                    <option value="11">November</option>
                                    <option value="12">Desember</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Tahun</label>
                                <input type="number" name="year" value="{{.CurrentYear}}" class="form-control">
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-download mr-1"></i> Unduh Excel (.xlsx)</button>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}
