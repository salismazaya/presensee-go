<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Presensee Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
    <!-- Navbar -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
            </li>
        </ul>
        <ul class="navbar-nav ml-auto">
            <li class="nav-item">
                <a href="/admin/logout" class="nav-link text-danger"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </li>
        </ul>
    </nav>

    <!-- Sidebar -->
    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a href="/admin/dashboard" class="brand-link">
            <span class="brand-text font-weight-bold ml-2">Presensee Admin</span>
        </a>
        <div class="sidebar">
            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
                    <li class="nav-item">
                        <a href="/admin/dashboard" class="nav-link {{if eq .ActiveMenu "dashboard"}}active{{end}}">
                            <i class="nav-icon fas fa-tachometer-alt"></i><p>Dashboard</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/kelas" class="nav-link {{if eq .ActiveMenu "kelas"}}active{{end}}">
                            <i class="nav-icon fas fa-school"></i><p>Kelas</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/siswa" class="nav-link {{if eq .ActiveMenu "siswa"}}active{{end}}">
                            <i class="nav-icon fas fa-user-graduate"></i><p>Siswa</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/users" class="nav-link {{if eq .ActiveMenu "users"}}active{{end}}">
                            <i class="nav-icon fas fa-users"></i><p>Pengguna</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/absensi" class="nav-link {{if eq .ActiveMenu "absensi"}}active{{end}}">
                            <i class="nav-icon fas fa-clipboard-list"></i><p>Monitoring Absensi</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/kunci" class="nav-link {{if eq .ActiveMenu "kunci"}}active{{end}}">
                            <i class="nav-icon fas fa-lock"></i><p>Kunci Absensi</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/sessions" class="nav-link {{if eq .ActiveMenu "sessions"}}active{{end}}">
                            <i class="nav-icon fas fa-clock"></i><p>Jadwal Sesi QR</p>
                        </a>
                    </li>
                    <li class="nav-header">TOOLS &amp; DATA</li>
                    <li class="nav-item">
                        <a href="/admin/import-siswa" class="nav-link {{if eq .ActiveMenu "import"}}active{{end}}">
                            <i class="nav-icon fas fa-file-import"></i><p>Import Siswa (.xlsx)</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/export-absensi" class="nav-link {{if eq .ActiveMenu "export"}}active{{end}}">
                            <i class="nav-icon fas fa-file-export"></i><p>Export Absensi (.xlsx)</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/data-sekolah" class="nav-link {{if eq .ActiveMenu "data_sekolah"}}active{{end}}">
                            <i class="nav-icon fas fa-cog"></i><p>Data Sekolah</p>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- Content Wrapper -->
    <div class="content-wrapper">
        <div class="content-header">
            <div class="container-fluid">
                <h1 class="m-0">{{.Title}}</h1>
            </div>
        </div>
        <section class="content">
            <div class="container-fluid">
                {{template "content" .}}
            </div>
        </section>
    </div>

    <footer class="main-footer text-sm">
        <strong>Presensee Go Core</strong> v1.0.0
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
