{{define "content"}}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-primary">
            <div class="card-header">
                <h3 class="card-title">Data &amp; Pengaturan Sekolah</h3>
            </div>
            <form method="POST">
                <div class="card-body">
                    <div class="form-group">
                        <label>Nama Aplikasi</label>
                        <input type="text" name="nama_aplikasi" value="{{.Data.NamaAplikasi}}" required class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Nama Sekolah</label>
                        <input type="text" name="nama_sekolah" value="{{.Data.NamaSekolah}}" required class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Deskripsi Sekolah</label>
                        <textarea name="deskripsi_sekolah" class="form-control" rows="4">{{.Data.DeskripsiSekolah}}</textarea>
                    </div>
                </div>
                <div class="card-footer text-right">
                    <button type="submit" class="btn btn-primary">Simpan Pengaturan</button>
                </div>
            </form>
        </div>
    </div>
</div>
{{end}}
